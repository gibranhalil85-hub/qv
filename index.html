<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Video</title>
    <!-- Open Graph Meta Tags untuk Preview Facebook -->
    <meta property="og:title" content="Watch Full Video Now">
    <meta property="og:description" content="Click to start streaming full video.">
    <meta property="og:image" content="https://via.placeholder.com/600x315.png">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0d1117;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .video-card {
            position: relative;
            width: 100%;
            max-width: 540px;
            background: #161b22;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-decoration: none;
            display: block;
        }
        .thumbnail-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* Rasio 16:9 */
            background: #000;
        }
        .thumbnail-img {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            opacity: 0.85;
        }
        .play-btn {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 68px; height: 68px;
            background: rgba(220, 38, 38, 0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(220, 38, 38, 0.6);
            transition: transform 0.2s ease;
        }
        .video-card:hover .play-btn {
            transform: translate(-50%, -50%) scale(1.1);
        }
        .play-icon {
            width: 0; height: 0;
            border-top: 12px solid transparent;
            border-bottom: 12px solid transparent;
            border-left: 20px solid #ffffff;
            margin-left: 4px;
        }
        .title-bar {
            padding: 14px 16px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Ganti URL href di bawah dengan Directlink Adsterra Anda -->
    <a href="https://zealoushavoc.com/jhvppahv59?key=15268bc3035010cdacf8162301dce948" class="video-card" target="_blank" rel="noopener">
        <div class="thumbnail-container">
            <!-- Ganti src di bawah dengan URL gambar thumbnail Anda -->
            <img src="https://ik.imagekit.io/9skj9ruuwg/Logo%20Keuangan%20Perbankan%20Gradien%20Modern%20Hitam%20dan%20Emas.png" alt="Video Thumbnail" class="thumbnail-img">
            <div class="play-btn">
                <div class="play-icon"></div>
            </div>
        </div>
        <div class="title-bar">
            Klik untuk Memutar Video Full HD
        </div>
    </a>

</body>
</html>
