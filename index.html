<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Video</title>
    <!-- Open Graph Meta Tags untuk Preview Facebook -->
    <meta property="og:title" content="Watch Full Video Now">
    <meta property="og:description" content="Click to start streaming full video.">
    <meta property="og:image" content="https://ik.imagekit.io/9skj9ruuwg/Logo%20(1).png">
    
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        body {
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100%;
            padding: 12px; /* Memberi jarak aman agar di HP tidak mentok pinggir layar */
        }
        .video-card {
            position: relative;
            width: 100%;
            max-width: 450px; /* Batas maksimal ukuran di komputer agar tidak terlalu besar/penuh */
            background: #000000;
            text-decoration: none;
            display: block;
            border-radius: 12px;
            overflow: hidden;
        }
        .thumbnail-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1; /* Menjaga kotak selalu 100% simetris mengikuti gambar */
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }
        .thumbnail-img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Gambar tampil utuh tanpa terpotong */
            display: block;
        }
        
        /* Animasi Bergerak & Berdenyut untuk Tombol Play */
        @keyframes pulse-play {
            0% {
                transform: translate(-50%, -50%) scale(0.95);
                box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7);
            }
            50% {
                transform: translate(-50%, -50%) scale(1.1);
                box-shadow: 0 0 0 15px rgba(220, 38, 38, 0);
            }
            100% {
                transform: translate(-50%, -50%) scale(0.95);
                box-shadow: 0 0 0 0 rgba(220, 38, 38, 0);
            }
        }

        .play-btn {
            position: absolute;
            top: 50%; 
            left: 50%;
            transform: translate(-50%, -50%);
            width: 68px; 
            height: 68px;
            background: rgba(220, 38, 38, 0.95);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid #ffffff;
            animation: pulse-play 1.6s infinite ease-in-out;
            cursor: pointer;
            z-index: 10;
        }
        
        .play-icon {
            width: 0; 
            height: 0;
            border-top: 12px solid transparent;
            border-bottom: 12px solid transparent;
            border-left: 20px solid #ffffff;
            margin-left: 4px;
        }
    </style>
</head>
<body>

    <a href="https://zealoushavoc.com/jhvppahv59?key=15268bc3035010cdacf8162301dce948" class="video-card" target="_blank" rel="noopener">
        <div class="thumbnail-container">
            <img src="https://ik.imagekit.io/9skj9ruuwg/Logo%20(1).png" alt="Video Thumbnail" class="thumbnail-img">
            <div class="play-btn">
                <div class="play-icon"></div>
            </div>
        </div>
    </a>

</body>
</html>
